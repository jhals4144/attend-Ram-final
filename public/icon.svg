<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Calendar outer frame -->
  <rect x="96" y="128" width="320" height="280" rx="36" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="12" stroke-opacity="0.2" />
  
  <!-- Header bar -->
  <rect x="96" y="128" width="320" height="80" rx="36" fill="#1e293b" />
  
  <!-- Calendar pins -->
  <rect x="160" y="96" width="28" height="60" rx="14" fill="url(#emeraldGrad)" />
  <rect x="324" y="96" width="28" height="60" rx="14" fill="url(#emeraldGrad)" />
  
  <!-- Big Checkmark -->
  <path d="M180 300 L235 355 L345 235" fill="none" stroke="url(#emeraldGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- 75% Badge text -->
  <circle cx="360" cy="360" r="48" fill="#10b981" />
  <text x="360" y="369" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">75%</text>
</svg>
