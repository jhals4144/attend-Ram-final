<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Obsidian & Space Gradient -->
    <radialGradient id="bgGlow" cx="45%" cy="35%" r="75%" fx="40%" fy="30%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="35%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Glass Bevel Highlight -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </linearGradient>

    <!-- Vibrant Emerald-Cyan AI Gradient -->
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="30%" stop-color="#2dd4bf" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Vibrant Cyan Electric Gradient -->
    <linearGradient id="cyanElectric" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- 75% Target Ring Gradient -->
    <linearGradient id="targetRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- AI Sparkle Gold/Cyan Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#10b981" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#06b6d4" flood-opacity="0.3" />
    </filter>

    <!-- Soft Ambient Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Squircle Base Container -->
  <rect width="512" height="512" rx="124" fill="url(#bgGlow)" />

  <!-- 2. Ambient Internal Glow Mesh -->
  <circle cx="256" cy="240" r="190" fill="#10b981" fill-opacity="0.12" filter="blur(40px)" />
  <circle cx="340" cy="170" r="130" fill="#06b6d4" fill-opacity="0.15" filter="blur(30px)" />
  <circle cx="170" cy="340" r="120" fill="#3b82f6" fill-opacity="0.10" filter="blur(35px)" />

  <!-- 3. Glassmorphic Outer Border & Specular Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="none" stroke="url(#bevelLight)" stroke-width="3" stroke-opacity="0.7" />

  <!-- 4. Background Subtle Timetable / Radar Grid (75% Attendance Ring) -->
  <!-- Target 75% Track (270 degrees arc) -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#334155" stroke-width="8" stroke-dasharray="8 8" opacity="0.4" />
  
  <!-- Glowing Target Progress Arc (representing >= 75% Attendance Goal) -->
  <path d="M 256 88 A 168 168 0 1 1 97.4 320" 
        fill="none" 
        stroke="url(#targetRingGrad)" 
        stroke-width="10" 
        stroke-linecap="round" 
        opacity="0.85" 
        filter="url(#neonGlow)" />

  <!-- 75% Target Pip Marker -->
  <circle cx="97.4" cy="320" r="8" fill="#67e8f9" filter="url(#neonGlow)" />
  <circle cx="97.4" cy="320" r="4" fill="#ffffff" />

  <!-- 5. Floating Glass Medical Badge & Timetable Card -->
  <rect x="136" y="116" width="240" height="280" rx="36" fill="#1e293b" fill-opacity="0.55" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15" filter="url(#softShadow)" />

  <!-- Timetable Grid Accent Dots / Schedule lines -->
  <line x1="164" y1="160" x2="220" y2="160" stroke="#64748b" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <line x1="164" y1="180" x2="200" y2="180" stroke="#64748b" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  
  <line x1="300" y1="160" x2="348" y2="160" stroke="#10b981" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <line x1="316" y1="180" x2="348" y2="180" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.7" />

  <!-- 6. Central Asclepius Medical Caduceus Staff (Intertwined Helix) -->
  <!-- Central Medical Staff -->
  <line x1="256" y1="140" x2="256" y2="368" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" opacity="0.9" />
  <circle cx="256" cy="136" r="10" fill="url(#aiGlow)" filter="url(#neonGlow)" />
  <circle cx="256" cy="136" r="4" fill="#ffffff" />

  <!-- Asclepius Snake / DNA Helix Curve Left to Right -->
  <path d="M 226 180 C 290 190, 290 226, 256 240 C 220 254, 220 290, 256 306 C 286 320, 280 348, 256 358" 
        fill="none" 
        stroke="url(#cyanElectric)" 
        stroke-width="7" 
        stroke-linecap="round" 
        opacity="0.8" />

  <!-- 7. Hero Checkmark (Bold, Dynamic 3D Attendance Success) -->
  <path d="M 174 274 L 232 334 L 358 194" 
        fill="none" 
        stroke="#020617" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.8" />

  <path d="M 174 274 L 232 334 L 358 194" 
        fill="none" 
        stroke="url(#aiGlow)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)" />

  <path d="M 180 274 L 232 328 L 352 198" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.9" />

  <!-- 8. AI Intelligence Sparkle Stars (4-Point Stars) -->
  <!-- Top Right AI Sparkle -->
  <g transform="translate(362, 126)">
    <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="url(#sparkleGrad)" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- Small AI Accent Sparkle Left -->
  <g transform="translate(138, 210) scale(0.65)">
    <path d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z" fill="url(#sparkleGrad)" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>

  <!-- Bottom Floating 75% Smart Target Capsule -->
  <g transform="translate(256, 420)">
    <rect x="-72" y="-18" width="144" height="36" rx="18" fill="#0f172a" stroke="url(#aiGlow)" stroke-width="2" filter="url(#neonGlow)" />
    <circle cx="-46" cy="0" r="5" fill="#10b981" />
    <text x="-32" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#f8fafc" letter-spacing="1">75% GOAL</text>
  </g>
</svg>
